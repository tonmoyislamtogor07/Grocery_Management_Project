<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FreshMart - Admin Portal Login</title>
  <!-- Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Stylesheet -->
  <link rel="stylesheet" href="css/login.css">
</head>
<body class="login-body">

  <div class="login-card">
    <div class="login-brand">
      <div class="login-logo">🛒</div>
      <h1>FreshMart ERP</h1>
      <p>Authorized Admin Portal Access</p>
    </div>

    <!-- Error Alert Box -->
    <div class="login-error-box" id="login-error"></div>

    <form class="login-form" id="login-form">
      <div class="form-group">
        <label for="login-email">Admin Email or Username</label>
        <div class="login-input-wrap">
          <span class="login-input-icon">👤</span>
          <input type="text" id="login-email" placeholder="admin@freshmart.com" value="admin@freshmart.com" required>
        </div>
      </div>

      <div class="form-group">
        <label for="login-password">Secret Password</label>
        <div class="login-input-wrap">
          <span class="login-input-icon">🔒</span>
          <input type="password" id="login-password" placeholder="••••••••" value="admin" required>
          <button type="button" class="toggle-password" id="toggle-password-btn" title="Toggle password visibility">👁️</button>
        </div>
      </div>

      <div style="display: flex; align-items: center; justify-content: space-between; font-size: 0.82rem; margin-bottom: 20px; color: var(--text-muted);">
        <label style="display: flex; align-items: center; gap: 6px; cursor: pointer; font-weight: 500;">
          <input type="checkbox" checked style="accent-color: var(--primary);"> Remember session
        </label>
        <span style="color: var(--primary); font-weight: 600;">Secure Portal</span>
      </div>

      <button type="submit" class="btn-login" id="btn-submit-login">
        <span>🔐</span> Sign In to Dashboard
      </button>
    </form>

    <!-- Quick 1-Click Demo Login -->
    <div class="demo-logins-wrap">
      <div class="demo-title">⚡ Quick 1-Click Demo Login:</div>
      <div class="demo-btn-group" id="demo-admin-list">
        <!-- Rendered via JS -->
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="js/common.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
